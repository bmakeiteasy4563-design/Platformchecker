<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>MIES TRADING - Sales Dashboard</title>
<meta name="description" content="Sales, product and profit dashboard for MIES TRADING" />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#245655" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MIES" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />

<style>
  html, body { margin: 0; padding: 0; background: #F6F7F5; }
  #root { min-height: 100vh; }
  #boot-loader {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #F6F7F5; font-family: -apple-system, sans-serif; color: #68706B; font-size: 14px;
    flex-direction: column; gap: 10px;
  }
  #boot-loader .dot { width: 34px; height: 34px; border-radius: 10px; background: #245655; color: #B8862F;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
</style>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "recharts": "https://esm.sh/recharts@2.12.7?deps=react@18.3.1,react-dom@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1,react-dom@18.3.1"
  }
}
</script>
</head>
<body>

<div id="root">
  <div id="boot-loader">
    <div class="dot">M</div>
    <div>Loading MIES Dashboard…</div>
  </div>
</div>

<script type="module" src="app.js"></script>

<script>
  window.addEventListener("error", function (e) {
    var loader = document.getElementById("boot-loader");
    if (loader && !window.__miesLoaded) {
      loader.innerHTML =
        '<div class="dot">!</div><div style="max-width:280px;text-align:center;">โหลดแอปไม่สำเร็จ<br/>' +
        (e && e.message ? e.message : "") +
        '</div>';
    }
  });

  setTimeout(function () {
    var loader = document.getElementById("boot-loader");
    if (loader && !window.__miesLoaded) {
      loader.innerHTML =
        '<div class="dot">!</div>' +
        '<div style="max-width:280px;text-align:center;">โหลดนานผิดปกติ<br/>' +
        'อาจเกิดจากอินเทอร์เน็ตช้าหรือหลุด ลองเปลี่ยนไปใช้ WiFi แล้วรีเฟรชหน้านี้อีกครั้ง</div>';
    }
  }, 15000);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch((err) => {
        console.warn("Service worker registration failed:", err);
      });
    });
  }
</script>

</body>
</html>
